# dsh-qq-moony bundle patch
# 把本包插进 profile 的层叠配置里。装好后 profile 只要在 bundles 里列出本包即生效。
#
# ⚠️ 这里只放「所有人都一样」的默认值。token / uin / 端口 / 人设这些属于各人自己的，
#    一律留空，由用户在 <DSH_HOME>/qq-moony/config.json 里填——本地文件优先级最高。
- insert:
    - id: qq-moony
      name: dsh-qq-moony
      config:
        enabled: true
        baseUrl: 'http://127.0.0.1:3000'
        token: ''
        uin: 0
        perHour: 20
        perDay: 60
